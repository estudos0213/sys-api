services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sys_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sys_api"]
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  pgdata:
